<!DOCTYPE html>
<html>
<head>
  <title>Counter Test</title>
</head>

<body style="background:black;color:white;">
  Visits: <span id="visit-count">Loading...</span>

<script>
  const namespace = "ajev04";
  const key = "visits";

  fetch(`https://api.counterapi.dev/v1/${namespace}/${key}`)
    .then(res => res.json())
    .then(data => {
      console.log("API response:", data); // debug

      if (data && typeof data.count !== "undefined") {
        document.getElementById("visit-count").innerText = data.count;
      } else {
        document.getElementById("visit-count").innerText = "Error";
      }
    })
    .catch(err => {
      console.log("Fetch error:", err);
      document.getElementById("visit-count").innerText = "Failed";
    });
</script>
</body>
</html>
