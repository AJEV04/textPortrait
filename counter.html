<!DOCTYPE html>
<html>
<head>
  <title>Visitor Stats</title>
</head>

<body style="background:black; color:white; text-align:center; margin-top:100px;">

  <h1>Visit Counter</h1>
  <h2 id="count">Loading...</h2>

  <p style="margin-top: 3rem;">
    This is how many times people looked at it 😄
  </p>

  <script>
    const namespace = "AJEV04";
    const key = "hotdog";

    fetch(`https://api.countapi.xyz/get/${namespace}/${key}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("count").innerText = data.value;
      });
  </script>

</body>
</html>
