<!DOCTYPE html>
<html>
<head>
  <title>Visit Counter</title>
</head>

<body style="
  background: radial-gradient(circle at top, #111, #000);
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
">

  <div style="
    padding: 40px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 30px rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
  ">

    <h1 style="margin:0; font-size:40px;">Visits</h1>

    <p id="visit-count" style="font-size:70px; margin:20px 0;">
      Loading...
    </p>

    <p style="opacity:0.6;">This is how many times you visited the site, hahaha</p>
    <p style="opacity:0.3;">Maria :>></p>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxaZSLX9miBchqnLlW4kAx1wDtBR8zIgM",
  authDomain: "hotdog-counter-20ef9.firebaseapp.com",
  databaseURL: "https://hotdog-counter-20ef9-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hotdog-counter-20ef9",
  storageBucket: "hotdog-counter-20ef9.firebasestorage.app",
  messagingSenderId: "101553294232",
  appId: "1:101553294232:web:0c5bbc63430d7709df79ed"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const counterRef = ref(db, "visits");

// LIVE READ ONLY
onValue(counterRef, (snapshot) => {
  document.getElementById("visit-count").innerText =
    snapshot.val() || 0;
});
</script>

</body>
</html>
