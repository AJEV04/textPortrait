<!DOCTYPE html>
<html>
<head>
  <title>Counter Test</title>
</head>

<body style="background:black;color:white;">
  Visits: <span id="visit-count">Loading...</span>

<script>
  const namespace = "ajev04";
  const key = "visits";

  const url = `https://api.counterapi.dev/v1/${namespace}/${key}`;

  fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`)
    .then(res => res.text())   // <-- IMPORTANT FIX
    .then(text => {
      const data = JSON.parse(text); // safer manual parse
      document.getElementById("visit-count").innerText = data.count;
    })
    .catch(err => {
      console.log("Error:", err);
      document.getElementById("visit-count").innerText = "Error";
    });
</script>

</body>
</html>
