<!DOCTYPE html>
<html>
<head>
  <title>Counter Test</title>
</head>

<body style="background:black;color:white;">
  Visits: <span id="visit-count">Loading...</span>

  <script>
    const namespace = "AJEV04";
    const key = "hotdog";

    fetch(`https://api.counterapi.dev/v1/${namespace}/${key}`)
      .then(res => res.json())
      .then(data => {
        console.log(data); // DEBUG (important)
        document.getElementById("visit-count").innerText = data.count;
      })
      .catch(err => console.log("Error:", err));
  </script>
</body>
</html>
