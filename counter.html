<!DOCTYPE html>
<html>
<head>
  <title>Counter Test</title>
</head>

<body style="background:black;color:white;">
  Visits: <span id="visit-count">Loading...</span>

<script>
  const namespace = "ajev04";
  const key = "visits";

  if (!sessionStorage.getItem("counted")) {
    // First visit in this tab → increment
    fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("visit-count").innerText = data.count;
      });

    sessionStorage.setItem("counted", "true");
  } else {
    // Already counted → just show something stable
    fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("visit-count").innerText = data.count;
      });
  }
</script>
</body>
</html>
